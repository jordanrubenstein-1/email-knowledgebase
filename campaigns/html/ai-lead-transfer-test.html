<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  
  <p>Hi {{${first_name} | default: "there"}},</p>

  <p>{{custom_attribute.${ai_email_opening_paragraph}}}</p>

  <p>{{custom_attribute.${ai_email_design_hook}}}</p>

  <table style="width: 100%; margin: 20px 0;">
    <tr>
      <td style="width: 50%; padding: 8px; text-align: center;">
        <img src="{{custom_attribute.${ai_product_image_1}}}" 
             alt="{{custom_attribute.${ai_product_name_1}}}" 
             style="max-width: 240px; border-radius: 8px;">
        <p style="font-size: 14px; color: #555;">{{custom_attribute.${ai_product_name_1}}}</p>
      </td>
      <td style="width: 50%; padding: 8px; text-align: center;">
        <img src="{{custom_attribute.${ai_product_image_2}}}" 
             alt="{{custom_attribute.${ai_product_name_2}}}" 
             style="max-width: 240px; border-radius: 8px;">
        <p style="font-size: 14px; color: #555;">{{custom_attribute.${ai_product_name_2}}}</p>
      </td>
    </tr>
  </table>

  <p>
    <a href="https://havenly.com/interior-design-services?lid=dottok4hczdd" 
       style="background-color: #2B2B2B; color: white; padding: 12px 24px; 
              text-decoration: none; border-radius: 4px; display: inline-block;">
      {{custom_attribute.${ai_email_cta_text}}}
    </a>
  </p>

  <p>— The Havenly Team</p>

</body>
</html>
