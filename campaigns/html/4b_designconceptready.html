<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Havenly</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4;">
  <!-- Row 1: Blue-bordered content block (600px total: 90px border each side, 420px white) -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width: 600px; width: 100%; margin: 0 auto;">
    <!-- Top blue border -->
    <tr>
      <td bgcolor="#304561" style="background-color: #304561; height: 90px; font-size: 1px; line-height: 1px;" colspan="3">&nbsp;</td>
    </tr>
    <tr>
      <!-- Left blue border -->
      <td bgcolor="#304561" style="background-color: #304561; width: 90px; font-size: 1px; line-height: 1px;" width="90">&nbsp;</td>
      <!-- White content (420px) -->
      <td bgcolor="#FFFFFF" style="background-color: #FFFFFF; width: 420px; padding: 40px 32px; vertical-align: top;" width="420">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width: 100%; margin: 0 auto;">
          <!-- Havenly logo - centered -->
          <tr>
            <td style="padding: 0 0 24px 0; text-align: center;">
              <img src="https://braze-images.com/appboy/communication/assets/image_assets/images/697ce0b41dead00063d9b3c5/original.png?1769791668" alt="HAVENLY" width="100" height="auto" style="display: block; max-width: 100%; height: auto; margin: 0 auto;" />
            </td>
          </tr>
          <!-- Icon - centered, smaller with white space above and below -->
          <tr>
            <td style="padding: 32px 0 32px 0; text-align: center;">
              <img src="https://braze-images.com/appboy/communication/assets/image_assets/images/697ce0b0d6990a00644f4aa7/original.png?1769791663" alt="" width="100" height="auto" style="display: block; max-width: 100%; height: auto; margin: 0 auto;" />
            </td>
          </tr>
          <!-- Header - all caps, Helvetica regular, 36px, line-height 68px -->
          <tr>
            <td style="padding: 0 0 16px 0; font-family: Helvetica, Arial, sans-serif; font-size: 36px; font-weight: normal; line-height: 68px; color: #000000; text-align: center; text-transform: uppercase;">
              HEADER TEXT
            </td>
          </tr>
          <!-- Body copy - Helvetica regular, 15px, line-height 34px -->
          <tr>
            <td style="padding: 0 0 24px 0; font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: normal; line-height: 34px; color: #000000; text-align: center;">
              Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.
            </td>
          </tr>
          <!-- Horizontal divider - 458px wide, centered (max 100% for narrow content) -->
          <tr>
            <td style="padding: 0 0 24px 0; text-align: center;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="356" style="margin: 0 auto; width: 356px; max-width: 100%;">
                <tr>
                  <td style="height: 1px; background-color: #cccccc; font-size: 1px; line-height: 1px;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- CTA button - black border, white bg, black text, Saans 24.75px / 27px -->
          <tr>
            <td style="padding: 0; text-align: center;">
              <a href="#" style="display: inline-block; font-family: 'Saans', Helvetica, Arial, sans-serif; font-size: 24.75px; line-height: 27px; font-weight: normal; color: #000000; text-decoration: none; border: 2px solid #000000; padding: 14px 32px; background-color: #FFFFFF;">CTA BUTTON</a>
            </td>
          </tr>
        </table>
      </td>
      <!-- Right blue border -->
      <td bgcolor="#304561" style="background-color: #304561; width: 90px; font-size: 1px; line-height: 1px;" width="90">&nbsp;</td>
    </tr>
    <!-- Bottom blue border -->
    <tr>
      <td bgcolor="#304561" style="background-color: #304561; height: 90px; font-size: 1px; line-height: 1px;" colspan="3">&nbsp;</td>
    </tr>
  </table>
  <!-- Row 2: Two-column kicker (order swapped - text/CTA left, illustration right) -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width: 600px; width: 100%; margin: 0 auto;">
    <tr>
      <td bgcolor="#FFFFFF" style="background-color: #FFFFFF; width: 600px;" width="600">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width: 100%;">
          <tr>
            <!-- Left: coral, headline + body + button (55%) -->
            <td bgcolor="#E86A4F" style="background-color: #E86A4F; width: 55%; padding: 48px 40px; text-align: center; vertical-align: middle;" width="330">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width: 100%;">
                <tr>
                  <td style="padding: 0 0 12px 0; font-family: Georgia, 'Times New Roman', serif; font-size: 22px; font-weight: bold; color: #ffffff; line-height: 1.3;">Lorem ipsum.</td>
                </tr>
                <tr>
                  <td style="padding: 0 0 20px 0; font-family: Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: normal; color: #ffffff; line-height: 1.5;">Our expert designers are always here to help.</td>
                </tr>
                <tr>
                  <td style="padding: 0;">
                    <a href="#" style="display: inline-block; font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: bold; color: #ffffff; text-decoration: none; letter-spacing: 0.05em; border: 2px solid #ffffff; padding: 12px 24px; border-radius: 24px; background-color: transparent;">GET INSPIRED</a>
                  </td>
                </tr>
              </table>
            </td>
            <!-- Right: white, illustration (45%) -->
            <td bgcolor="#FFFFFF" style="background-color: #FFFFFF; width: 45%; padding: 48px 40px; text-align: center; vertical-align: middle;" width="270">
              <img src="https://braze-images.com/appboy/communication/assets/image_assets/images/697ce3459cc93a0063fe50d0/original.png?1769792325" alt="" width="140" height="auto" style="display: block; max-width: 100%; height: auto; margin: 0 auto;" />
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
