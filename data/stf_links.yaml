    # pick Bedding as a topic/category for a new send. This entry stays so that a send a
    # human deliberately and manually briefs for bedding still auto-builds with the correct
    # link. See CLAUDE.md STF Link Map for the standing rule.
  - url: https://www.stfrank.com/collections/quilts-throws
    label: Throws
    keywords: ["throw", "throws", "quilt", "quilts"]
