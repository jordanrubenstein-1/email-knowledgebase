# ---------------------------------------------------------------------------
# PT email template styling per brand
# ---------------------------------------------------------------------------
# Controls font family and web font URL used by the plain-text HTML template
# in build_pt_campaign.py.  Keyed by base brand code (HAV, not HAV_PC/CONV)
# since PT styling is the same for both HAV variants.
pt_email_styles:
  HAV:
    font_family: "'Open Sans', Arial, Sans-serif"
    font_url: "https://fonts.googleapis.com/css?family=Open+Sans"
    template: "components/hav_pt_template.html"
    default_signoff: "Best,"
    default_signoff_name: "Lisa from Havenly"
    # Lock the name block to "Lisa from Havenly" regardless of how the brief
    # wrote it.  The havenly-copywriter skill has no PT signoff guidance at
    # all, so drafts are free to invent one; the closing phrase from the brief
    # is still honoured, only the name is standardised.
    signoff_name_locked: true
  CZ:
    font_family: "Helvetica, Arial, Sans-serif"
    font_url: null
    template: "components/cz_pt_template.html"
    background_color: "#f6f5f4"
    logo_url: "https://braze-images.com/appboy/communication/assets/image_assets/images/67f83def4631c700674e669c/original.png?1744322031"
    logo_alt: "The Citizenry"
    logo_link: "https://www.the-citizenry.com/"
    default_signoff: "With gratitude,"
    default_signoff_name: "Lisa / Head of Client Experience"
    # Lock the name block to "Lisa / Head of Client Experience".  The
    # citizenry-brand-voice skill still prescribes a stale name ("Martin /
    # Head of Client Experience"), which matches neither the default nor any
    # alias — without this it would be returned as a signoff *override* and
    # ship verbatim.  The closing phrase from the brief is still honoured.
    signoff_name_locked: true
    signoff_name_aliases:
      - "Martin / Head of Client Experience"
      - "Martin"
      - "The Citizenry"
      - "The Citizenry Team"
  ID:
    font_family: "Arial, Sans-serif"
    font_url: "https://fonts.googleapis.com/css?family=Open+Sans"
    template: "components/id_pt_template.html"
    default_signoff: "Happy Shopping,"
    default_signoff_name: "Lisa"
    default_signoff_name_extra: "The Interior Define Team"
    # Always render the name block as "Lisa" / "The Interior Define Team" (two
    # lines), regardless of how the copywriter wrote the name in the brief.
    # The closing phrase (e.g. "Warmly,") is still taken from the brief when
    # present; only the name portion is locked to the standard.
    signoff_name_locked: true
    signoff_name_aliases:
      - "The Interior Define Team"
      - "Interior Define Team"
      - "The Interior Define"
      - "Interior Define"
    footer_content_block:
      sale: "{{content_blocks.${PT_sale_footer_unsubscribe} | id: 'cb3'}}"
      non_sale: "{{content_blocks.${PT_unsubscribe}}}"
  BUR:
    font_family: "Arial, Sans-serif"
    font_url: "https://d1qnmprc5tnkc9.cloudfront.net/fonts/c506d6b24ddd6d6a415b040bedcc2c5d.woff"
    template: "components/bw_pt_template.html"
    default_signoff: "Warmly,"
    default_signoff_name: "Lisa at Burrow"
    default_signoff_name_plain: "Lisa at Burrow"
    signoff_name_aliases:
      - "Burrow"
      - "Burrow Team"
      - "The Burrow Team"
    footer_content_block:
      sale: "{{content_blocks.${PT_sale_footer_unsubscribe} | id: 'cb3'}}"
      non_sale: "{{content_blocks.${PT_unsubscribe}}}"
  STF:
    font_family: "Helvetica, Arial, Sans-serif"
    font_url: null
    template: "components/stf_pt_template.html"
    default_signoff: "Happy Shopping!"
    default_signoff_name: "Lisa at St. Frank"
    signoff_name_aliases:
      - "Blake at St. Frank"
      - "St. Frank"
  TI:
    font_family: "Arial, Sans-serif"
    font_url: null
    # TI was the only brand with no default_signoff, so build_pt_prompt() fell
    # back to its hardcoded "Best," and never asked for the real TI close.  The
    # 9/7 Labor Day Last Chance brief came back signed "xx," as a result.
    default_signoff: "Happy Shopping!"
    default_signoff_name: "Lisa at The Inside"
    # Lock the whole signoff block (phrase + name) — the-inside-copywriter
    # states "Happy Shopping! / Lisa at The Inside" is the only TI PT close.
    signoff_name_locked: true
    signoff_name_aliases:
      - "The Inside"
  TRADE:
    font_family: "Helvetica, Arial, Sans-serif"
    font_url: null
