# ---------------------------------------------------------------------------
# PT email seed campaigns (BEE/DnD editor) per brand key.
# When present, build_pt_campaign.py duplicates the seed instead of creating
# from the HTML editor — resulting campaigns are in DnD mode for easy editing.
#
# One-time setup: create each seed manually in the BEE editor with this
# block structure: [logo image block] + [body text block] + [HTML footer block].
# Name each seed exactly as listed here so the search-and-duplicate step finds it.
#
# Leave a key blank (null) to fall back to the HTML editor for that brand.
# ---------------------------------------------------------------------------
