# Brand-specific Braze campaign configuration
# Used by build_pt_campaign.py, build_sms_campaign.py, and
# build_push_campaign.py to configure audiences, conversion events,
# and default send times.
#
# Source: Lifecycle Common Data Set CSV + user-specified conversion events
# Last updated: 2026-02-10

# SMS-specific configuration per brand.
# Used by build_sms_campaign.py for UTM parameters, audience segments,
# and send time defaults.
#
# UTM patterns sourced from exports/sms-welcome-series.csv and
# reports/sms-rewrites-interior-define.md
sms_config:
  ID:
    segment: "SMS Master List - Double Opt In"
    utm_source: "braze_ID"
    base_url: "https://www.interiordefine.com"
    include_userid: false
    include_bzt: true
    send_time: "15:00"
    # Keyword → URL path mapping for smart link resolution when copy has LINK placeholder
    link_paths:
      - keywords: ["store", "find your store", "location", "locations", "showroom", "studio", "studios", "sip and sit", "sip + sit", "sip sit"]
        path: "/locations"
      - keywords: ["leather"]
        path: "/collections/leather"
      - keywords: ["swatch", "swatches"]
        url: "https://swatches.interiordefine.com"
      - keywords: ["quick ship", "ready to ship", "in stock", "in-stock"]
        path: "/quick-ship"
      - keywords: ["new arrival", "new arrivals"]
        path: "/new-arrivals"
      - keywords: ["rug", "rugs"]
        path: "/rugs"
      - keywords: ["sofa", "couch"]
        path: "/living/all-custom-sofas"
      - keywords: ["sectional"]
        path: "/living/all-custom-sectionals"
      - keywords: ["chair", "chairs"]
        path: "/living/all-custom-chairs"
      - keywords: ["bed", "beds", "bedroom"]
        path: "/bedroom/all-beds"
      - keywords: ["dining", "table"]
        path: "/dining"
      - keywords: ["gift card", "gift cards"]
        path: "/products/gift-card"
      - keywords: ["best seller", "bestseller", "popular"]
        path: "/collections/best-sellers"
      - keywords: ["warehouse"]
        path: "/warehouse"
      - keywords: ["sale", "event", "promo", "discount", "off"]
        path: "/"
  BUR:
    segment: "SMS Master List - Double Opt In"
    utm_source: "braze_BW"
    base_url: "https://burrow.com"
    include_userid: true
    extra_params:
      bzt: "{{${user_id}}}"
      em: "{{${email_address}}}"
      fn: "{{${first_name}}}"
      ln: "{{${last_name}}}"
    send_time: "15:00"
    # link_paths are loaded at runtime from data/bur_links.yaml — do not add entries here.
  CZ:
    segment: "SMS Master List - Double Opted In"
    utm_source: "braze_CZ"
    base_url: "https://www.the-citizenry.com"
    include_userid: false
    send_time: "15:00"
    # link_paths are loaded at runtime from data/cz_links.yaml — do not add entries here.
  TI:
    segment: "Master SMS Segment"
    utm_source: "braze_TI"
    base_url: "https://www.theinside.com"
    include_userid: false
    send_time: "15:00"
    # NOT used for actual TI SMS sending — TI is Klaviyo and its real SMS
    # builder (scripts/create_klaviyo_sms.py) never reads this brand_config.yaml
    # entry. That script's link_paths equivalent is loaded at runtime from
    # data/ti_links.yaml via _ti_default_links_from_yaml(). This block is kept
    # only because build_pt_campaign.py and process_ai_feedback.py read other
    # fields (base_url, etc.) off this same sms_config.TI entry — do not add
    # link_paths back here, it would have no effect on TI SMS.
  STF:
    segment: "SMS Master List - Double Opted In"
    utm_source: "braze_SF"
    base_url: "https://www.stfrank.com"
    include_userid: false
    send_time: "15:00"
    # link_paths are loaded at runtime from data/stf_links.yaml — do not add entries here.

# ---------------------------------------------------------------------------
# Push notification configuration (Havenly only).
# Used by build_push_campaign.py.
#
# The duplicate-based workflow finds the most recent push campaign of the
# correct audience type (PC or CONV) in the Braze campaigns list, duplicates
# it, then edits the campaign name, push title, push message, and delivery
# date.  Audience, conversions, deep links, and on-click behavior carry over
# from the duplicated campaign.
# ---------------------------------------------------------------------------
push_config:
  HAV_PC:
    segment: "Pre-Converted Push Audience"
    deep_link: "https://havenly.com?utm_source=braze_havenly&utm_campaign={{campaign.$(name)}}&utm_medium=push&utm_content=pre_converted#packages-section"
    send_time: "15:00"
  HAV_CONV:
    segment: "Converted Push Audience"
    deep_link: "https://havenly.com/shop?utm_source=braze_havenly&utm_campaign={{campaign.$(name)}}&utm_medium=push&utm_content=converted"
    send_time: "15:00"

