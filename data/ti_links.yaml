# The Inside — commonly used landing page URLs for auto-briefing
# Sourced from TI link library spreadsheet (3 sheets) + confirmed URLs from campaign HTML files.
# All URLs use https://www.theinside.com/ prefix.
#
# keywords: on `categories` + `product_categories` entries only, used for
# keyword-based link resolution. Two different consumers read this file:
#   - scripts/create_klaviyo_sms.py's resolve_link() — matches keywords as a
#     substring of the CAMPAIGN NAME (not the SMS copy), first match wins in
#     list order (not scored) — see _ti_default_links_from_yaml(), which sorts
#     entries by keyword length descending so specific phrases are checked
#     before generic ones.
#   - build_sms_campaign.py's resolve_landing_page() is NOT used for TI — TI
#     SMS never goes through that script.
# The `Sale` entry deliberately has no keywords — CLAUDE.md documents
# /collections/sale as a page to avoid defaulting to; "sale"/"promo"/"event"
# route to Homepage instead. `destinations`/`edits`/`prints` below are one-off
# seasonal editorial collections (label-driven lookup only, not keyword
# matching) — adding keywords there risks false-positive matches on common
# words (Red, Yellow, Spring, etc.), so they're left as-is.

# General landing pages (homepage, collections, etc.)
categories:
  - url: https://www.theinside.com/
    label: Homepage
    keywords: ["sale", "event", "promo", "discount", "off"]
  - url: https://www.theinside.com/fabric-swatches
    label: Fabric Swatches
    keywords: ["swatch", "swatches", "fabric swatch"]
  - url: https://www.theinside.com/collections/furniture
    label: All Furniture
    keywords: ["furniture"]
  - url: https://www.theinside.com/collections/outdoorliving
    label: Outdoor
    keywords: ["outdoor"]
