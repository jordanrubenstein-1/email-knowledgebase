# CZ Known URLs — extracted from real campaign HTML files
# All URLs here have been used in at least one sent campaign.
# Collections are grouped by category for readability.
# Products include a display name derived from the slug.
#
# keywords: used for SMS keyword-based link resolution (build_sms_campaign.py) —
# only present on `collections` entries where a distinctive, unambiguous keyword
# exists. Deliberately omitted on: overly generic nav pages (Shop All, Shop by
# Room, Shop All Decor/Tabletop/Kitchen) where a forced keyword would cause
# false-positive matches; and near-duplicate entries (Throws vs. Shop All
# Throws & Blankets, Towels & Bath Mats vs. Bath Towels/Bath Mats, Baskets
# (alt)) to avoid keyword collisions between two entries with equal scores —
# see build_sms_campaign.py's resolve_landing_page() scoring, which picks
# whichever entry scores highest, with ties going to whichever appears first.
# The `products` section below intentionally has no keywords — SMS category
# resolution doesn't need per-product entries (~700 of them); those are only
# used by build_cz_prompt()'s exact-name product matching.

