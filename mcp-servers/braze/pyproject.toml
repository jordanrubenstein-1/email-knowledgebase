[project]
name = "braze-mcp"
version = "0.1.0"
description = "MCP server for Braze operations - REST API and Playwright automation"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "pyotp>=2.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-watch>=4.2.0",
]

[project.scripts]
braze-mcp = "braze_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/braze_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring real credentials",
]
addopts = "-v"

[tool.coverage.run]
source = ["src/braze_mcp"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
